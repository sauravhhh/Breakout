<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Breakout</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Breakout" />
<style>
  :root{
    --bg:#0b1220;
    --panel:#111a2e;
    --line:#1e2a45;
    --ink:#eef2f7;
    --soft:#8b98b0;
    --cyan:#22d3ee;
    --cyan-deep:#0891b2;
    --green:#4ade80;
    --red:#fb7185;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  body{ display:flex; justify-content:center; touch-action:manipulation; }
  .app{
    width:100%; max-width:460px; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }
  header{ width:100%; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:34px; height:34px; border-radius:9px; display:block; }
  .brand-name{ font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .stats{ display:flex; gap:8px; }
  .stat-box{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:6px 12px; text-align:center; min-width:58px;
  }
  .stat-box .lbl{ font-size:10px; color:var(--soft); text-transform:uppercase; letter-spacing:.08em; }
  .stat-box .val{ font-size:18px; font-weight:700; color:var(--cyan); font-variant-numeric:tabular-nums; }
  .board-wrap{ position:relative; width:100%; }
  canvas{
    display:block; width:100%; aspect-ratio:440/560;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    touch-action:none;
  }
  .overlay{
    position:absolute; inset:0; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:rgba(11,18,32,.82); backdrop-filter:blur(3px);
    text-align:center; padding:24px;
  }
  .overlay[hidden]{ display:none; }
  .overlay h2{ margin:0; font-size:26px; letter-spacing:-0.01em; }
  .overlay p{ margin:0; color:var(--soft); font-size:14px; line-height:1.5; }
  .overlay .final{ font-size:15px; color:var(--ink); }
  .overlay .final b{ color:var(--cyan); font-size:22px; }
  .btn{
    border:none; cursor:pointer; font-size:16px; font-weight:700;
    background:var(--cyan); color:#083344;
    padding:13px 34px; border-radius:14px; margin-top:6px;
  }
  .btn:active{ transform:scale(.97); }
  .hint{ margin-top:14px; color:var(--soft); font-size:13px; text-align:center; line-height:1.6; }
  .hint kbd{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:1px 7px; font-size:12px; font-family:inherit;
  }
  footer{ margin-top:auto; padding-top:22px; }
  footer p{ margin:0; font-size:12.5px; color:var(--soft); }
  footer span{ color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="" width="34" height="34">
      <span class="brand-name">Breakout</span>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
      <div class="stat-box"><div class="lbl">Lives</div><div class="val" id="lives">3</div></div>
      <div class="stat-box"><div class="lbl">Level</div><div class="val" id="level">1</div></div>
    </div>
  </header>

  <div class="board-wrap">
    <canvas id="board" width="440" height="560" aria-label="Breakout game board"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>Ready?</h2>
      <p>Drag the paddle or use <kbd>←</kbd><kbd>→</kbd>.<br>Break all the bricks. Don't drop the ball.</p>
      <button class="btn" id="startBtn">Play</button>
    </div>
    <div class="overlay" id="overOverlay" hidden>
      <h2>Game over</h2>
      <p class="final">Score <b id="finalScore">0</b></p>
      <p id="newBest" hidden>New best! 🏆</p>
      <button class="btn" id="againBtn">Play again</button>
    </div>
    <div class="overlay" id="pauseOverlay" hidden>
      <h2>Paused</h2>
      <button class="btn" id="resumeBtn">Resume</button>
    </div>
  </div>

  <div class="hint">
    Drag or <kbd>←</kbd><kbd>→</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> to pause &amp; launch
  </div>

  <footer><p>Made with <span>❤️</span> by sauravhhh</p></footer>
</div>

<script>
/* ---- Pure game simulation (no DOM): fully unit-testable ---- */
function createBreakout(){
  const W = 440, H = 560;
  const ROWS = 5, COLS = 8, GAP = 8, TOP = 64, SIDE = 16, BRICK_H = 26;
  const BRICK_COLORS = ['#f87171','#fb923c','#fbbf24','#a3e635','#22d3ee'];

  const S = {
    W, H,
    state: 'menu',          // menu | serve | play | pause | over
    score: 0, lives: 3, level: 1,
    paddle: { x: W/2, w: 96, h: 14, y: H - 46 },
    ball: { x: W/2, y: 0, vx: 0, vy: 0, r: 8, speed: 340 },
    bricks: [],
    levelFlash: 0,
  };

  function buildBricks(){
    S.bricks = [];
    const bw = (W - SIDE*2 - GAP*(COLS-1)) / COLS;
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        S.bricks.push({
          x: SIDE + c*(bw+GAP), y: TOP + r*(BRICK_H+GAP),
          w: bw, h: BRICK_H, alive: true, color: BRICK_COLORS[r % BRICK_COLORS.length],
        });
      }
    }
  }

  function reset(full){
    if (full){ S.score = 0; S.lives = 3; S.level = 1; S.ball.speed = 340; }
    S.paddle.x = W/2;
    buildBricks();
    serve();
  }

  function serve(){
    S.state = 'serve';
    S.ball.x = S.paddle.x;
    S.ball.y = S.paddle.y - S.ball.r - 2;
    S.ball.vx = 0; S.ball.vy = 0;
  }

  function launch(){
    if (S.state !== 'serve') return;
    const sp = S.ball.speed;
    S.ball.vx = sp * 0.35;
    S.ball.vy = -sp * 0.94;
    S.state = 'play';
  }

  // circle-vs-rect: returns collision normal or null
  function collide(bx, by, r, rx, ry, rw, rh){
    const cx = Math.max(rx, Math.min(bx, rx + rw));
    const cy = Math.max(ry, Math.min(by, ry + rh));
    const dx = bx - cx, dy = by - cy;
    if (dx*dx + dy*dy > r*r) return null;
    if (Math.abs(dx) > Math.abs(dy)) return { nx: (dx >= 0 ? 1 : -1), ny: 0 };
    if (Math.abs(dy) > Math.abs(dx)) return { nx: 0, ny: (dy >= 0 ? 1 : -1) };
    return { nx: 0, ny: (by < ry + rh/2 ? -1 : 1) };
  }

  function reflect(ball, n){
    const d = ball.vx*n.nx + ball.vy*n.ny;
    ball.vx -= 2*d*n.nx;
    ball.vy -= 2*d*n.ny;
    // keep a minimum vertical component so the ball never goes flat
    const sp = Math.hypot(ball.vx, ball.vy) || ball.speed;
    if (Math.abs(ball.vy) < sp*0.25){
      ball.vy = (ball.vy >= 0 ? 1 : -1) * sp*0.25;
      const sx = Math.sign(ball.vx) || 1;
      ball.vx = sx * Math.sqrt(Math.max(sp*sp - ball.vy*ball.vy, 1));
    }
  }

  function step(dt, input){
    if (S.state !== 'play') return;

    // paddle
    const p = S.paddle;
    if (input && input.paddleX != null){
      p.x = Math.max(p.w/2, Math.min(W - p.w/2, input.paddleX));
    } else if (input){
      p.x += ((input.right?1:0) - (input.left?1:0)) * 560 * dt;
      p.x = Math.max(p.w/2, Math.min(W - p.w/2, p.x));
    }

    // ball
    const b = S.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // walls
    if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy); }

    // paddle (only when falling onto it)
    if (b.vy > 0){
      const n = collide(b.x, b.y, b.r, p.x - p.w/2, p.y, p.w, p.h);
      if (n){
        const off = Math.max(-1, Math.min(1, (b.x - p.x) / (p.w/2)));
        const ang = off * (Math.PI/3);            // max 60° from vertical
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = sp * Math.sin(ang);
        b.vy = -Math.abs(sp * Math.cos(ang));
        b.y = p.y - b.r - 1;
      }
    }

    // bricks
    for (const br of S.bricks){
      if (!br.alive) continue;
      const n = collide(b.x, b.y, b.r, br.x, br.y, br.w, br.h);
      if (n){
        br.alive = false;
        S.score += 10 * S.level;
        reflect(b, n);
        // nudge out so we don't catch the same brick twice
        b.x += n.nx * 2; b.y += n.ny * 2;
        break;
      }
    }

    // level cleared
    if (S.bricks.every(br => !br.alive)){
      S.level++;
      S.ball.speed *= 1.08;
      S.levelFlash = 1.6;
      buildBricks();
      serve();
      return;
    }

    // missed
    if (b.y - b.r > H){
      S.lives--;
      if (S.lives <= 0){
        S.state = 'over';
      } else {
        serve();
      }
    }
  }

  return { S, reset, serve, launch, step, collide };
}

/* ---- DOM wiring ---- */
(function(){
  "use strict";
  const game = createBreakout();
  const S = game.S;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scale = canvas.width / S.W;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');

  const BEST_KEY = 'breakout-best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;

  const keys = { left:false, right:false };
  let rafId = null, lastT = 0;

  function syncHud(){
    scoreEl.textContent = S.score;
    livesEl.textContent = S.lives;
    levelEl.textContent = S.level;
  }

  function start(){
    game.reset(true);
    startOverlay.hidden = true;
    overOverlay.hidden = true;
    pauseOverlay.hidden = true;
    syncHud();
    cancelAnimationFrame(rafId);
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    cancelAnimationFrame(rafId);
    finalScoreEl.textContent = S.score;
    const isBest = S.score > best;
    if (isBest){
      best = S.score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    newBestEl.hidden = !isBest;
    overOverlay.hidden = false;
    draw();
  }

  function togglePause(){
    if (S.state !== 'play' && S.state !== 'pause') return;
    if (S.state === 'play'){
      S.state = 'pause';
      pauseOverlay.hidden = false;
      cancelAnimationFrame(rafId);
    } else {
      S.state = 'play';
      pauseOverlay.hidden = true;
      lastT = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  function loop(now){
    rafId = requestAnimationFrame(loop);
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.033) dt = 0.033;
    if (S.levelFlash > 0) S.levelFlash -= dt;
    game.step(dt, keys);
    if (S.state === 'over'){ gameOver(); return; }
    syncHud();
    draw();
  }

  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(scale, scale);

    // bricks
    for (const br of S.bricks){
      if (!br.alive) continue;
      ctx.fillStyle = br.color;
      rr(br.x, br.y, br.w, br.h, 6);
      ctx.fill();
    }

    // paddle
    const p = S.paddle;
    ctx.fillStyle = '#22d3ee';
    rr(p.x - p.w/2, p.y, p.w, p.h, 7);
    ctx.fill();

    // ball
    const b = S.ball;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = '#eef2f7';
    ctx.fill();

    // level flash banner
    if (S.levelFlash > 0){
      ctx.fillStyle = 'rgba(238,242,247,' + Math.min(1, S.levelFlash).toFixed(2) + ')';
      ctx.font = '700 30px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Level ' + S.level, S.W/2, S.H/2);
    }

    // serve hint
    if (S.state === 'serve' && startOverlay.hidden && overOverlay.hidden){
      ctx.fillStyle = 'rgba(139,152,176,0.9)';
      ctx.font = '15px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Tap to launch', S.W/2, S.H - 110);
    }

    ctx.restore();
  }

  // --- input ---
  document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.left = true; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.right = true; e.preventDefault(); }
    if (e.code === 'Space'){
      e.preventDefault();
      if (!startOverlay.hidden || !overOverlay.hidden) start();
      else if (S.state === 'serve') game.launch();
      else togglePause();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  function canvasX(clientX){
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * S.W;
  }
  let dragging = false;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    if (S.state === 'serve' && startOverlay.hidden && overOverlay.hidden) game.launch();
    keys.paddleX = canvasX(e.clientX);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging) keys.paddleX = canvasX(e.clientX);
  });
  window.addEventListener('pointerup', () => { dragging = false; delete keys.paddleX; });
  canvas.addEventListener('click', () => {
    if (S.state === 'play') togglePause();
  });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.state === 'play') togglePause();
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  game.reset(true);
  syncHud();
  draw();
})();
</script>
</body>
</html>
